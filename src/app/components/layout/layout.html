<app-header (toggleSidebar)="toggleSidebar()" (logoff)="onLogoff()"></app-header>
<div class="layout-container">
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <nav>
      <ul>
        @if (loggedInUserData(); as user) {
          @if (user.role === rolesEnum.SUPER_ADMIN_ROLE) {
            <li>
              <a routerLink="/home/admin-dashboard" routerLinkActive="active">Admin Dashboard</a>
            </li>
            <li>
              <a routerLink="/home/batch" routerLinkActive="active">Batches</a>
            </li>
            <li>
              <a routerLink="/home/candidate" routerLinkActive="active">Candidates</a>
            </li>
            <li>
              <a routerLink="/home/batch-enrollments" routerLinkActive="active">Batch Enrollments</a>
            </li>
            <li>
              <a routerLink="/home/batch-sessions" routerLinkActive="active">Batch Admin Sessions</a>
            </li>
          } @else {
            <li>
              <a routerLink="/home/candidate-dashboard" routerLinkActive="active">Candidate Dashboard</a>
            </li>
            <li>
              <a routerLink="/home/candidate-recordings" routerLinkActive="active">Candidate Recordings</a>
            </li>
          }
        }
        <li style="color:red">
  ROLE: {{ loggedInUserData()?.role }}
</li>
      </ul>
    </nav>
  </aside>
  <main class="main-content" [class.sidebar-open]="sidebarOpen()">
    <router-outlet></router-outlet>
  </main>
</div>
